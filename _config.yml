# Hexo Configuration
## Site
title: 要梯子
subtitle: 梯子推荐、机场推荐与梯子 VPN 服务资料中心
description: 要梯子：面向关注梯子推荐、机场推荐、梯子vpn和好用梯子资料的专业信息站。集中呈现 28 家主流机场套餐价格、专线节点、流量规则与适用场景。
keywords: 梯子推荐, 机场推荐, 梯子vpn, 好用的梯子, 要梯子, 机场推荐指南, 梯子购买前须知
author: 要梯子编辑部
language: zh-CN
timezone: Asia/Shanghai

## URL
url: https://tiziwant.blog
permalink: :category/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

## Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

## Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

## Home page setting
index_generator:
  path: blog
  per_page: 10
  order_by: -date

## Category & Tag
default_category: uncategorized
category_map:
  机场资料: service
  机场指南: airport-guide
  梯子 VPN: ladder-vpn
  好用的梯子: good-ladder


## Metadata elements
meta_generator: true

## Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

## Pagination
per_page: 10
pagination_dir: page

## Theme
theme: next

## Search Database
search:
  path: search.xml
  field: post
  content: true
  format: html

## Sitemap
sitemap:
  path: sitemap.xml
  template:
  rel: false
  tags: false
  categories: true
